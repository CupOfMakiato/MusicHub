<section class="playlistPage">
    <header class="playlistHeader">
        <!-- <div class="playlistHeaderBanner" id="playlistHeaderBanner"></div> -->
        <div class="playlistHeaderBody">
            <button
                id="playlistImageEditBtn"
                class="playlistImageButton"
                type="button"
                aria-label="Edit playlist image"
            >
                <img
                    id="playlistImage"
                    class="playlistImage"
                    src="./assets/music-placeholder.png"
                    alt="Playlist image"
                    draggable="false"
                />
                <span class="playlistImageEditIcon" aria-hidden="true">
                    <i data-lucide="pencil-line"></i>
                </span>
            </button>
            <div class="playlistMeta">
                <p class="playlistMetaLabel">Playlist</p>
                <h2 id="playlistTitle">No playlist selected</h2>
                <p id="playlistSubtitle">
                    <span id="playlistTrackCount">Choose a playlist from your library.</span
                    ><span id="playlistDuration"></span>
                </p>
            </div>
        </div>
    </header>

    <section class="playlistControls">
        <button id="playlistPlayBtn" type="button" aria-label="Play playlist">
            <i data-lucide="play"></i>
        </button>
        <button id="playlistShuffleBtn" type="button" aria-label="Shuffle playlist">
            <i data-lucide="shuffle"></i>
        </button>
        <button id="playlistAdvanceOptionsBtn" type="button" aria-label="Advance options">
            <i data-lucide="ellipsis"></i>
        </button>
    </section>

    <section class="playlistTrackSection" id="playlistTrackContainer">
        <table class="playlistTrackTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Title</th>
                    <th>Artist</th>
                    <th>Album</th>
                    <th>
                        Date Added
                        <p>dd/mm/yyyy</p>
                    </th>
                    <th>Duration</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="playlistTrackBody"></tbody>
        </table>
    </section>
</section>
