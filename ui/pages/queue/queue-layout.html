<section class="queuePage">
    <header class="queueHeader">
        <h2>Play Queue</h2>
        <p>Current play order from your active session.</p>
    </header>

    <div id="queueEmptyState" class="queueEmptyState" hidden>
        <p>No tracks in queue yet. Play a playlist, folder, or file to populate the queue.</p>
    </div>

    <section class="queueSection">
        <h3>Now playing</h3>
        <ul id="queueNowPlaying" class="queueList"></ul>
    </section>

    <section class="queueSection">
        <h3 id="queueNextTitle">Next up</h3>
        <ul id="queueUpcoming" class="queueList"></ul>
    </section>
</section>
