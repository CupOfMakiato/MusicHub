<div class="bottomPlayer">
  <div class="playerLeft">

    <img
      id="albumArt"
      src="./assets/music-placeholder.png"
      class="albumArt"
      style="height: 200px; width: 200px;"
    />

    <div class="trackInfo">
      <div id="trackTitle">
        No song selected
      </div>

      <div id="trackArtist">
        Unknown artist
      </div>
    </div>

  </div>
  <div class="playerCenter">

    <button id="prevBtn" type="button" aria-label="Previous track">
      <i data-lucide="skip-back"></i>
    </button>

    <button id="playPauseBtn" type="button" aria-label="Play/Pause">
      <!-- <i data-lucide="pause"></i> -->
      <i data-lucide="play"></i>
    </button>

    <button id="nextBtn" type="button" aria-label="Next track">
      <i data-lucide="skip-forward"></i>
    </button>

    <span id="currentTime">
      0:00
    </span>

    <input
      type="range"
      id="progressSlider"
      min="0"
      max="100"
      value="0"
    />

    <span id="duration">
      2:00
    </span>

    

  </div>
  <div class="playerRight">

    <button id="volumeBtn">
      <!-- state -->
      <!-- <i data-lucide="volume-x"></i> -->
      <!-- <i data-lucide="volume"></i> -->
      <!-- <i data-lucide="volume-1"></i> -->    
      <i data-lucide="volume-2"></i>
    </button>

    <input
      type="range"
      id="volumeSlider"
      min="0"
      max="1"
      step="0.01"
      value="0.7"
    />
  </div>

</div>
