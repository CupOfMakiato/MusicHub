<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./ui.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/howler@2.2.4/dist/howler.min.js"></script>
    <script src="https://unpkg.com/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
    <!-- <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    /> -->
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    
    <title>Blueberry Player</title>
  </head>
  <body>
    <!-- <h1>first start of BlueberryPlayer</h1> -->

    <div id="sidebar"></div> 
    <img id="coverImage" src="./assets/music-placeholder.png" alt="Album cover" draggable="false"/>
    <h2 id="trackTitle">No track selected</h2>
    <p id="trackArtist">Select a file to start playing</p>

    <button id="selectFile">Select File</button>
    <button id="selectFolder">Select Folder</button>
    <div id="bottom-player"></div>
    <script src="./state/player-state.js"></script>
    <script src="./services/audio-service.js"></script>
    <script src="./components/bottom-player/player.js"></script>
    <script src="./script.js"></script>
  </body>
  
</html>
